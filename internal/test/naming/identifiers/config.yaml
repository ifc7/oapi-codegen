# yaml-language-server: $schema=../../../../configuration-schema.json
package: namingidentifiers
output: identifiers.gen.go
# Union of the flags every folded case needs:
#   - models       : issue1767 (underscore field → PascalCase)
#   - server       : issue-head-digit-of-operation-id (operationId starting with digit)
#                    issue-head-digit-of-httpheader   (header name starting with digit)
#                    issues #30, #41, #209 (path parameter binding)
#   - client       : issues #30, #41, #209 (path parameter styling)
#   - skip-prune   : keep schemas/components not referenced by a path
generate:
  models: true
  server: true
  client: true
output-options:
  skip-prune: true
