# yaml-language-server: $schema=../../../../configuration-schema.json
package: optionsstructtags
output: struct_tags.gen.go
generate:
  models: true
output-options:
  skip-prune: true
  # struct-tags: user-configurable struct tag generation. Entries merge by
  # name on top of the defaults (json, form), so yaml, validate and db add
  # new tags.
  struct-tags:
    tags:
      - name: yaml
        template: '{{.FieldName}}'
      - name: validate
        template: '{{if not .IsOptional}}required{{end}}'
      - name: db
        template: '{{.FieldName}}'
