# yaml-language-server: $schema=../../../../configuration-schema.json
package: aggregatesanyof
output: anyof.gen.go
# Union of flags used across all folded sources:
#   - models  : base for all cases
#   - client  : all four sources generate a client
#   - std-http-server: issue-1189, any_of/codegen/inline, any_of/codegen/ref_schema all generate a server
generate:
  models: true
  client: true
  std-http-server: true
