# yaml-language-server: $schema=../../../../configuration-schema.json
package: schemasobjects
output: objects.gen.go
# issue #1277: exercises models, client, std-http-server, and strict-server generation
# for a response whose content schema is an array of objects with additionalProperties:true.
output-options:
  skip-prune: true
generate:
  models: true
  client: true
  std-http-server: true
  strict-server: true
